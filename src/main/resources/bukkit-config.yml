
# イベント開始設定
event-start:
  # いずれかの条件を満たすと実行
  conditions:
    - type: real-clock
      timezone: Asia/Tokyo  # or local
      time-hours: 22
      time-minutes: 30

  # 開始前通知
  pre-notify:
    enable: true
    minutes: 3

  # 開始通知
  start-notify:
    # 盲目の付与
    blind-effect: true
    # Landスポーンが設定されていなければ、敷地内のランダムな位置にテレポートします
    teleport-to-land: true

  # 開始アクション
  actions:

# 襲撃設定
raid:
  # Land未所属プレイヤーを退出または参加させない設定
  non-members-kick-enable: true
  # ゲーム時間
  event-time-minutes: 30
  # ウェーブ数
  waves: 5
  # ウェーブの最大時間。現ウェーブの敵を全て倒すか、この時間が経過すると次のウェーブに移行します (0 以下で無効)
  max-wave-time-minutes: 6
  # ボスバー表示設定
  bossbar:
    # 襲撃イベントの進行状況をボスバーに表示します
    enable: true
    color: purple  # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/boss/BarColor.html
    style: solid  # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/boss/BarStyle.html
    # 仕様できる値: %wave%, %max_waves%, %enemies%, %total_enemies%, %tickets%
    text: "&6Wave: %wave%/%max_waves% &f| &c敵残存数: %enemies% &f| &e残りチケット: %tickets%"
  # 死亡回数の制限。このカウントが 0 になるとイベント終了(敗北)します (0 以下で無効)
  tickets: 20
  # イベント中に付与する権限グループ
  luckperms-group: in-raidspawner
  # 襲撃イベントを発生させるワールド (nullでLandのスポーン設定を使用)
  world:
  # スポーン位置: Landから離すチャンク数
  mobs-distance-chunks: 2
  # モブに白光効果を付与する敵残存数
  mobs-growing-enemies: 10
  # モブ設定
  mobs:
    # 式に使用できる値: online_players, land_players, land_chunks, wave
    - count: "ceil( land_players * (3 + land_chunks * 1.5) * (1 + 0.1 * wave) )"  # or number value
      # スポーン対象
      enemies:
        - source: mythicmobs
          type: MOB_TYPE
          level: 1
          priority: 10

# 成功報酬設定
event-win-rewards:
  # 条件を満たしたもののみ実行
  conditions:
    - type: timer
      time-minutes: 15
      actions:
        player:
          add-money: 3000
        land:

  # どの条件も満たされていない場合のアクション
  condition-else:
    actions:
      player:
        add-money: 5
      land:

# 失敗報酬設定
event-lose-rewards:
  actions:
    player:
    land:
      remove-chunk: 1

# イベント終了設定
event-end:
  send-result-to-discord: true


# Discord連携設定
discord:
  # 連携機能の有効 (DiscordSRVが必要です)
  enable: false
  # 通知を送信するチャンネルID
  channel: 000000000000000000
